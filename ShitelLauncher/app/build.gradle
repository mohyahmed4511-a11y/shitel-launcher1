plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.shitellauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.shitellauncher"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
